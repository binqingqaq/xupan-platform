spring:
  application:
    name: xupan-server
  datasource:
    url: ${XUPAN_DB_URL:jdbc:mysql://127.0.0.1:3307/xupan_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${XUPAN_DB_USERNAME:xupan_app}
    password: ${XUPAN_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
xupan:
  auth:
    refresh-cookie-secure: ${XUPAN_AUTH_REFRESH_COOKIE_SECURE:true}
    bootstrap-admin:
      enabled: ${XUPAN_AUTH_BOOTSTRAP_ADMIN_ENABLED:false}
      username: ${XUPAN_AUTH_BOOTSTRAP_ADMIN_USERNAME:}
      password: ${XUPAN_AUTH_BOOTSTRAP_ADMIN_PASSWORD:}
