spring:
  application:
    name: xupan-server
  datasource:
    url: ${XUPAN_DB_URL:jdbc:mysql://127.0.0.1:3307/xupan_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${XUPAN_DB_USERNAME:xupan_app}
    password: ${XUPAN_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 显式配置连接池：不配就吃 Hikari 默认值 10，而本应用有 5 个 @Scheduled 任务
      # 与 HTTP 请求共享同一个池，任一环节在事务里阻塞就会排队雪崩。
      # 20 是按"单实例 + 峰值并发"给的起点，可用环境变量按机器调大。
      maximum-pool-size: ${XUPAN_DB_POOL_MAX_SIZE:20}
      minimum-idle: ${XUPAN_DB_POOL_MIN_IDLE:5}
      connection-timeout: ${XUPAN_DB_POOL_CONNECTION_TIMEOUT_MS:10000}
      idle-timeout: ${XUPAN_DB_POOL_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${XUPAN_DB_POOL_MAX_LIFETIME_MS:1800000}
      # 泄漏检测：连接借出超过 60 秒未归还就打日志，用来及早发现"长事务里做网络调用"。
      leak-detection-threshold: ${XUPAN_DB_POOL_LEAK_DETECTION_MS:60000}
      pool-name: xupan-pool
  flyway:
    enabled: true
xupan:
  retention:
    enabled: ${XUPAN_DATA_RETENTION_ENABLED:true}
    cron: ${XUPAN_DATA_RETENTION_CRON:0 30 3 * * *}
    batch-size: ${XUPAN_DATA_RETENTION_BATCH_SIZE:500}
    max-batches-per-table-per-run: ${XUPAN_DATA_RETENTION_MAX_BATCHES_PER_TABLE:20}
    chat-days: ${XUPAN_DATA_RETENTION_CHAT_DAYS:5}
    login-days: ${XUPAN_DATA_RETENTION_LOGIN_DAYS:180}
    operation-days: ${XUPAN_DATA_RETENTION_OPERATION_DAYS:365}
    ledger-days: ${XUPAN_DATA_RETENTION_LEDGER_DAYS:1095}
  display:
    mobile:
      external:
        enabled: ${XUPAN_DISPLAY_MOBILE_EXTERNAL_ENABLED:true}
        base-url: ${XUPAN_DISPLAY_MOBILE_EXTERNAL_BASE_URL:https://m.16894913.com}
        hot-lottery-path: ${XUPAN_DISPLAY_MOBILE_EXTERNAL_HOT_PATH:/api/lottery/getLotteryListByHot.do}
        referer: ${XUPAN_DISPLAY_MOBILE_EXTERNAL_REFERER:https://m.16894913.com/html/public/home.html}
        connect-timeout: ${XUPAN_DISPLAY_MOBILE_EXTERNAL_CONNECT_TIMEOUT:3s}
        request-timeout: ${XUPAN_DISPLAY_MOBILE_EXTERNAL_REQUEST_TIMEOUT:8s}
        cache-ttl: ${XUPAN_DISPLAY_MOBILE_EXTERNAL_CACHE_TTL:2s}
  avatar:
    storage-dir: ${XUPAN_AVATAR_STORAGE_DIR:${user.dir}/var/uploads/avatars}
    max-size-bytes: ${XUPAN_AVATAR_MAX_SIZE_BYTES:5242880}
  robot:
    dispatch-interval-ms: ${XUPAN_ROBOT_DISPATCH_INTERVAL_MS:1000}
    dispatch-batch-size: ${XUPAN_ROBOT_DISPATCH_BATCH_SIZE:50}
    processing-lease-seconds: ${XUPAN_ROBOT_PROCESSING_LEASE_SECONDS:30}
    max-attempts: ${XUPAN_ROBOT_MAX_ATTEMPTS:8}
  test-player:
    behavior-enabled: ${XUPAN_TEST_PLAYER_BEHAVIOR_ENABLED:true}
    dispatch-interval-ms: ${XUPAN_TEST_PLAYER_DISPATCH_INTERVAL_MS:1000}
  chat:
    message:
      max-robot-payload-bytes: ${XUPAN_CHAT_MAX_ROBOT_PAYLOAD_BYTES:65536}
    websocket:
      allowed-origins: ${XUPAN_CHAT_WS_ALLOWED_ORIGINS:http://127.0.0.1:5173,http://localhost:5173}
      max-connections-per-user: ${XUPAN_CHAT_WS_MAX_CONNECTIONS_PER_USER:3}
      max-connections: ${XUPAN_CHAT_WS_MAX_CONNECTIONS:5000}
      heartbeat-interval: ${XUPAN_CHAT_WS_HEARTBEAT_INTERVAL:20s}
      heartbeat-timeout: ${XUPAN_CHAT_WS_HEARTBEAT_TIMEOUT:30s}
      max-pending-messages: ${XUPAN_CHAT_WS_MAX_PENDING_MESSAGES:100}
      container-configured: ${XUPAN_CHAT_WS_CONTAINER_CONFIGURED:true}
      max-message-bytes: ${XUPAN_CHAT_WS_MAX_MESSAGE_BYTES:16384}
      max-outbound-message-bytes: ${XUPAN_CHAT_WS_MAX_OUTBOUND_MESSAGE_BYTES:65536}
      max-messages-per-window: ${XUPAN_CHAT_WS_MAX_MESSAGES_PER_WINDOW:10}
      message-rate-window: ${XUPAN_CHAT_WS_MESSAGE_RATE_WINDOW:10s}
  auth:
    refresh-cookie-secure: ${XUPAN_AUTH_REFRESH_COOKIE_SECURE:true}
    player-link-lifetime: ${XUPAN_AUTH_PLAYER_LINK_LIFETIME:168h}
    player-link-display-key: ${XUPAN_AUTH_PLAYER_LINK_DISPLAY_KEY:}
    bootstrap-admin:
      enabled: ${XUPAN_AUTH_BOOTSTRAP_ADMIN_ENABLED:false}
      username: ${XUPAN_AUTH_BOOTSTRAP_ADMIN_USERNAME:}
      password: ${XUPAN_AUTH_BOOTSTRAP_ADMIN_PASSWORD:}
