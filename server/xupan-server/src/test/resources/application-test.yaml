spring:
  datasource:
    url: jdbc:h2:mem:xupan;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
xupan:
  robot:
    dispatch-interval-ms: 60000
    dispatch-batch-size: 50
    processing-lease-seconds: 30
    max-attempts: 8
  automation:
    enabled: false
  chat:
    websocket:
      allowed-origins: http://127.0.0.1:5173,http://localhost:5173
      max-connections-per-user: 2
      max-connections: 4
      heartbeat-interval: 20s
      heartbeat-timeout: 30s
      max-pending-messages: 2
      max-message-bytes: 4096
      max-messages-per-window: 10
      message-rate-window: 10s
  auth:
    refresh-cookie-secure: false
    bootstrap-admin:
      enabled: false
